<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みゅ画像ガチャ</title>
<style>
html,body{margin:0;height:100%;background:#0b0a1a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);overflow:hidden;font-family:"Yusei Magic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.35}50%{opacity:.7}}
#globe{left:3%;top:25%;width:30%;height:30%;background:radial-gradient(circle,rgba(255,200,100,.55),transparent 70%)}
#lamp{left:78%;top:62%;width:20%;height:20%;background:radial-gradient(circle,rgba(255,190,90,.6),transparent 70%);animation-delay:-1.2s}
.lt{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,205,110,.75),rgba(255,160,60,.25) 45%,transparent 70%);animation:fk 2.8s ease-in-out infinite}
@keyframes fk{0%{opacity:.35;scale:.92}12%{opacity:.7;scale:1.03}25%{opacity:.45;scale:.96}41%{opacity:.8;scale:1.06}55%{opacity:.5;scale:.97}70%{opacity:.75;scale:1.02}85%{opacity:.4;scale:.94}100%{opacity:.35;scale:.92}}
#btn{position:absolute;left:50%;bottom:3%;width:46%;transform:translateX(-50%);cursor:pointer;border:0;background:none;padding:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));transition:opacity .3s}
#btn.gray img,#again.gray img{filter:grayscale(1) brightness(.88)}
#btn.gray:hover,#again.gray:hover{filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#btn img{width:100%;display:block;pointer-events:none}
#btn:hover{filter:drop-shadow(0 0 14px #ffd36a) brightness(1.1)}
#btn:active{transform:translateX(-50%) scale(.94)}
#btn.off{opacity:0;pointer-events:none}
#btn.press{animation:press .35s ease-out}
@keyframes press{0%,100%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) translateY(2px) scale(.96);filter:drop-shadow(0 3px 5px rgba(0,0,0,.6)) brightness(.88)}}
#intro{position:absolute;inset:0;background:radial-gradient(circle,#fff,#fff6d6);pointer-events:none;animation:intro 2.6s .2s ease-out forwards}
@keyframes intro{to{opacity:0;visibility:hidden}}
#stage.shake{animation:sh .24s ease-in-out infinite}
@keyframes sh{0%{transform:translate(2px,1px)}25%{transform:translate(-2px,-1px)}50%{transform:translate(1px,-2px)}75%{transform:translate(-1px,2px)}100%{transform:translate(2px,1px)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffe9a8 60%,#ffd36a);opacity:0;pointer-events:none}
#flash.go{animation:fo 2.2s ease-in-out}
@keyframes fo{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
#shade{position:absolute;inset:0;background:rgba(5,3,20,.72);opacity:0;pointer-events:none;transition:opacity .5s}
#shade.on{opacity:1}
#res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5%;padding-bottom:17%;box-sizing:border-box;pointer-events:none;opacity:0}
#res.on{opacity:1}
#res.on #card{pointer-events:auto}
#rar{display:none;font-size:min(6vw,6vh);font-weight:bold;letter-spacing:.1em;color:#ffe08a;text-shadow:0 0 14px #ff9f1a;transform:scale(0)}
#card{background:#fffaf0 no-repeat center/contain;box-sizing:border-box;border-radius:6px;transform:rotateY(90deg) scale(.4);box-shadow:0 0 30px 6px var(--c,#ffd36a);position:relative;overflow:hidden}
#card .ph{width:100%;height:100%;display:block;object-fit:fill;border-radius:3px}
#card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-120%)}
#res.on #card{animation:flip .9s cubic-bezier(.2,1.3,.4,1) forwards}
#res.on #card::after{animation:shine 1.6s .9s ease-in-out infinite}
#res.on #rar{display:none;animation:pop .5s .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes flip{to{transform:rotateY(0) scale(1)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes shine{to{transform:translateX(120%)}}
#cap{max-width:90%;text-wrap:balance;text-align:center;line-height:1.5;font-size:min(3.5vw,3.5vh);color:#fff3c9;text-shadow:0 0 8px #000,0 0 14px #6a3ca3,1px 1px 0 #2a1840;opacity:0;pointer-events:none}
#res.on #cap{animation:fi .8s 1.1s forwards}
#again{position:absolute;left:50%;bottom:3%;width:46%;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.ab{white-space:nowrap;font-family:inherit;font-size:min(3.5vw,3.5vh);color:#fff3c9;background:#4b2a7a;border:2px solid #e8b94a;border-radius:99px;padding:.35em 1em;cursor:pointer}
.ab:hover{background:#6a3ca3}
.acts{display:flex;gap:3vw}
#racts{opacity:0;pointer-events:none}
#res.on #racts{animation:fi .8s 1.3s forwards;pointer-events:auto}
#zbtn{position:absolute;right:3%;top:3%}
#zukan,#view{position:absolute;inset:0;background:rgba(8,6,24,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3%;padding:4%;box-sizing:border-box}
#zukan.on,#view.on{display:flex}
#zt{font-size:min(5.5vw,5.5vh);color:#ffe08a;text-shadow:0 0 10px #ff9f1a}
#ztabs{display:flex;gap:2vw}
.tab{white-space:nowrap;font-family:inherit;font-size:min(3.4vw,3.4vh);color:#d9c8ff;background:#2a1d4a;border:2px solid #4b3a78;border-radius:99px;padding:.3em .9em;cursor:pointer}
.tab.on{color:#2a1840;background:#ffd36a;border-color:#ffd36a;font-weight:bold}
#zg{max-height:56%;overflow-y:auto;-webkit-overflow-scrolling:touch;align-content:start;display:grid;grid-template-columns:repeat(3,1fr);gap:3%;width:92%}
.zc{aspect-ratio:1;border-radius:6px;background:#241a3d center/cover;position:relative;border:2px solid #4b3a78;display:flex;align-items:center;justify-content:center;color:#7a66a8;font-size:min(8vw,8vh)}
.zc.got{border-color:#e8b94a;cursor:pointer}
.zc img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.zc .n{position:absolute;right:5px;bottom:3px;color:#fff3c9;font-size:min(3.6vw,3.6vh);text-shadow:0 0 4px #000,0 0 6px #000}
.zc .h{position:absolute;right:5px;top:2px;color:#ff7aa8;font-size:min(4.5vw,4.5vh);text-shadow:0 0 4px #000}
#vimg{max-width:86%;max-height:50%;border:6px solid #fffaf0;border-radius:6px;box-shadow:0 0 24px 4px #ffd36a}
#vcap{max-width:90%;text-wrap:balance;text-align:center;line-height:1.5;font-size:min(3.5vw,3.5vh);color:#fff3c9}
#note{position:absolute;left:0;right:0;bottom:.7%;text-align:center;font-size:min(2.7vw,2.7vh);color:rgba(255,243,201,.75);text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none}
#toast{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);white-space:nowrap;background:rgba(20,10,40,.92);color:#fff3c9;border:2px solid #e8b94a;border-radius:99px;padding:.4em 1em;font-size:min(3.6vw,3.6vh);opacity:0;pointer-events:none;transition:opacity .3s}
#back{position:absolute;right:3%;top:3%;font-family:inherit;font-size:min(3.6vw,3.6vh);color:#fff3c9;background:#4b2a7a;border:2px solid #e8b94a;border-radius:99px;padding:.35em 1em;cursor:pointer;opacity:0;pointer-events:none}
#res.on #back{animation:fi .5s 1.6s forwards;pointer-events:auto}
#back:hover{background:#6a3ca3}
#again img{width:100%;display:block;pointer-events:none}
#res.on #again{animation:fi .5s 1.6s forwards;pointer-events:auto}
@keyframes fi{to{opacity:1}}
#again:hover{filter:drop-shadow(0 0 14px #ffd36a) brightness(1.1)}
.sp{position:absolute;pointer-events:none;color:#ffe08a;text-shadow:0 0 8px #ffb300;will-change:transform,opacity}
#gold{position:absolute;left:3%;top:7.2%;font-size:min(3.4vw,3.4vh);color:#ffe08a;text-shadow:0 0 6px #000,0 0 10px #000;pointer-events:none}
#cnt{position:absolute;left:3%;top:2.5%;font-size:min(3.4vw,3.4vh);color:#fff3c9;text-shadow:0 0 6px #000,0 0 10px #000;pointer-events:none}
</style></head><body>
<div id="stage">
 <img id="bg" src="assets/bg.jpg" alt="">
 <div class="glow" id="globe"></div><div class="glow" id="lamp"></div>
 <div id="cnt">ガチャった回数：0</div><div id="gold">所持G：3G</div>
 <button class="ab" id="zbtn">📖 アルバム</button>
 <div id="shade"></div>
 <button id="btn" aria-label="1回ガチャる"><img src="assets/btn.webp" alt="1回ガチャる"></button>
 <div id="note">みゅ的都合により画質は低めみゅ。</div>
 <div id="intro"></div><div id="flash"></div>
 <div id="res"><div id="rar"></div><div id="card"><img class="ph" alt=""></div><div id="cap"></div><div class="acts" id="racts"></div><button id="back">◀ 屋台にもどる</button><button id="again" aria-label="もう1回"><img src="assets/again.webp" alt="もう1回"></button></div>
<div id="zukan"><div id="zt"></div><div id="ztabs"></div><div id="zg"></div><button class="ab" id="zc">とじる</button></div>
 <div id="view"><img id="vimg" alt=""><div id="vcap"></div><div class="acts" id="vacts"></div><button class="ab" id="vc">とじる</button></div>
 <div id="toast"></div>
</div>
<script src="images.js"></script>
<script>
// ===== 調整用の設定 =====
const CARDS=(window.MYU_IMAGES||[]).map(a=>["images/"+a[0],0,0,a[1]||"",a[0]]);   // images.js から読み込み（出る確率はすべて同じ）
const SHAKE_MS=1800;                         // ガチャを回している時間
// ========================
const $=id=>document.getElementById(id),st=$("stage");
let n=0,busy=false,shown=false,g=3;
function showG(){$("gold").textContent="所持G："+g+"G";$("btn").classList.toggle("gray",g<1);$("again").classList.toggle("gray",g<1)}
function say(t){const d=document.createElement("div");
 (Array.isArray(t)?t:[...t]).forEach((ch,i)=>{const sp=document.createElement("span"),iv=document.createElement("span");iv.textContent=ch;iv.style.cssText="display:inline-block;white-space:pre"+(ch.length>1?"":";transform:skewX(-14deg)");sp.appendChild(iv);sp.style.cssText="display:inline-block;white-space:pre";d.appendChild(sp);
  sp.animate([{transform:"translateY(0)"},{transform:"translateY(-.3em)"},{transform:"translateY(0)"},{transform:"translateY(.18em)"},{transform:"translateY(0)"}],{duration:2200,delay:i*160,iterations:Infinity,easing:"ease-in-out",fill:"backwards"})});
 d.style.cssText="position:absolute;left:51%;top:37%;font-size:min(6vw,6vh);color:#fff7dc;pointer-events:none;white-space:nowrap;text-shadow:0 0 6px #6a3ca3,0 0 14px #ffb300,2px 2px 0 #2a1840,-2px -2px 0 #2a1840,2px -2px 0 #2a1840,-2px 2px 0 #2a1840";
 st.appendChild(d);
 d.animate([{transform:"translate(-50%,calc(-100% + 10px)) rotate(0deg)",opacity:0},{transform:"translate(-50%,calc(-100% - 5px)) rotate(-2deg)",opacity:1,offset:.22},{transform:"translate(-50%,calc(-100% - 22px)) rotate(2deg)",opacity:1,offset:.45},{transform:"translate(-50%,calc(-100% - 38px)) rotate(-3deg)",opacity:1,offset:.7},{transform:"translate(-50%,calc(-100% - 55px)) rotate(4deg)",opacity:0}],{duration:5200,easing:"ease-in-out"}).onfinish=()=>d.remove()}
function noG(){const was=shown;if(was)reset();$("btn").classList.remove("off");const bt=$("btn");bt.classList.remove("press");void bt.offsetWidth;bt.classList.add("press");setTimeout(()=>bt.classList.remove("press"),400);
 const e=$("gold");e.textContent="所持G："+g+"G（たりないよ…）";e.style.color="#ff8f8f";
 e.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:300,iterations:2});
 clearTimeout(noG.t);noG.t=setTimeout(()=>{showG();e.style.color=""},4000);
 if(!noG.s||Date.now()-noG.s>5400){noG.s=Date.now();setTimeout(()=>say(["み","ゅ","…","…","(›´ω`‹ )"]),was?700:0)}}
// ランタンの光 [x%, y%, 大きさ%, 周期s, 遅延s]
[[24.7,16,13,2.6,0],[43,28.3,8,3.1,-1],[67.8,37.5,9,2.3,-.6],[76.9,31.5,8,3.4,-2],[94,64.6,13,2.7,-1.4],[16,92,11,3.2,-.3],[1.5,30.7,9,2.9,-1.9]].forEach(([x,y,w,d,dl])=>{
 const e=document.createElement("div");e.className="lt";e.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${w}%;animation-duration:${d}s;animation-delay:${dl}s`;st.insertBefore(e,$("cnt"))});

function spark(x,y,N,spread=1,big=1){for(let i=0;i<N;i++){const s=document.createElement("div");s.className="sp";s.textContent=Math.random()<.5?"✦":"✨";
 const a=Math.random()*6.283,d=(60+Math.random()*180)*spread,sz=(10+Math.random()*16)*big;
 s.style.cssText+=`left:${x}px;top:${y}px;font-size:${sz}px`;st.appendChild(s);
 s.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(1) rotate(${Math.random()*180}deg)`,opacity:0}],{duration:900+Math.random()*700,easing:"ease-out"}).onfinish=()=>s.remove();}}
function pos(fx,fy){const r=st.getBoundingClientRect();return[r.width*fx,r.height*fy]}
function loadImg(i){const c=CARDS[i];return new Promise(r=>{const im=new Image();im.onload=()=>{c[1]=im.naturalWidth;c[2]=im.naturalHeight;r(1)};im.onerror=()=>{c[1]=c[1]||4;c[2]=c[2]||3;r(0)};im.src=c[0]})}
function gacha(){
 if(busy){if(shown){reset();setTimeout(gacha,500)}return}if(g<1){noG();return}if(!CARDS.length){toast("景品がまだないみゅ…");return}const ci=Math.random()*CARDS.length|0,pre=loadImg(ci);g--;store.g=g;save();showG();busy=true;$("btn").classList.add("press");
 let t;
 setTimeout(()=>{st.classList.add("shake");
  t=setInterval(()=>{const[x,y]=pos(.18,.4);spark(x,y,3,.8)},220);},380);
 setTimeout(()=>{
  clearInterval(t);st.classList.remove("shake");
  pre.then(()=>{const card=$("card"),c=CARDS[ci],S=st.clientWidth,k=Math.min(S*.7/c[1],S*.44/c[2]),pad=Math.max(6,S*.012);
  card.style.width=c[1]*k+pad*2+"px";card.style.height=c[2]*k+pad*2+"px";card.style.padding=pad+"px";
  $("cap").textContent=c[3];cur=ci;const isNew=!store.own.includes(ci);if(isNew)store.own.push(ci);store.cnt=store.cnt||{};store.cnt[ci]=isNew?1:(store.cnt[ci]||1)+1;store.rec=(store.rec||[...store.own].reverse()).filter(x=>x!==ci);store.rec.unshift(ci);save();$("rar").textContent="NEW!";$("rar").style.display=isNew?"block":"none";paintFav();renderZ();
  card.querySelector(".ph").src=c[0];
  card.style.setProperty("--c","#ffd36a");
  $("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");
  setTimeout(()=>{$("shade").classList.add("on");$("res").classList.add("on");$("btn").classList.add("off");shown=true;const[x,y]=pos(.5,.5);spark(x,y,30,2.2,1.4)},900);
  n++;$("cnt").textContent="ガチャった回数："+n;})
 },SHAKE_MS+380);
}
function reset(){
 $("res").classList.remove("on");$("shade").classList.remove("on");
 const c=$("card");c.style.animation="none";$("rar").style.animation="none";void c.offsetWidth;c.style.animation="";$("rar").style.animation="";
 $("btn").classList.remove("press");busy=false;shown=false;
}
$("back").onclick=()=>{$("btn").classList.remove("off");reset()};
$("btn").onclick=gacha;$("again").onclick=()=>{if(g<1){noG();return}reset();setTimeout(gacha,500)};

// ===== 図鑑・お気に入り・共有 =====
let store={own:[],fav:[]},cur=0;
try{const t=localStorage.getItem("myu-gacha");if(t)store=JSON.parse(t)}catch(e){}
{const id=x=>typeof x==="number"?(CARDS[x]&&CARDS[x][4]):x,ix=x=>CARDS.findIndex(c=>c[4]===id(x)),f=a=>(a||[]).map(ix).filter(i=>i>=0),cnt={};
 for(const k in store.cnt||{}){const i=ix(isNaN(+k)?k:+k);if(i>=0)cnt[i]=store.cnt[k]}
 store.own=f(store.own);store.fav=f(store.fav);if(store.rec)store.rec=f(store.rec);store.cnt=cnt}
function save(){try{const nm=i=>CARDS[i][4],cnt={};for(const k in store.cnt)if(CARDS[k])cnt[nm(k)]=store.cnt[k];
 localStorage.setItem("myu-gacha",JSON.stringify({v:4,g:store.g,d:store.d,own:store.own.map(nm),fav:store.fav.map(nm),rec:(store.rec||[]).map(nm),cnt}))}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function paintFav(){document.querySelectorAll("[data-a=fav]").forEach(b=>b.textContent=(store.fav.includes(cur)?"♥":"♡")+" お気に入り")}
function fav(){const i=store.fav.indexOf(cur);i<0?store.fav.push(cur):store.fav.splice(i,1);save();paintFav();renderZ()}
async function share(){let bl;const c=CARDS[cur],text="みゅ画像ガチャで出たみゅ！「"+c[3]+"」";
 try{const f=(()=>0,new File([bl=await(await fetch(c[0])).blob()],"myu."+(bl.type.split("/")[1]||"jpg"),{type:bl.type||"image/jpeg"}));
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return}
  if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==="AbortError")return}
 try{await navigator.clipboard.writeText(text);toast("文をコピーしたみゅ。画像は長押しで保存できるみゅ")}catch(e){toast("共有できなかったみゅ…")}}
function mkActs(p){p.innerHTML='<button class="ab" data-a="fav"></button><button class="ab" data-a="share">共有</button>';p.onclick=e=>{const a=e.target.dataset.a;if(a==="fav")fav();if(a==="share")share()}}
let zmode=2;
function zlist(){const o=store.own,f=store.fav.filter(x=>o.includes(x));
 if(zmode===0)return f.concat(o.filter(x=>!f.includes(x)));
 if(zmode===1){const r=(store.rec||[...o].reverse()).filter(x=>o.includes(x));return r.concat([...o].reverse().filter(x=>!r.includes(x)))}
 return o}
function renderZ(){$("ztabs").innerHTML="";["お気に入り順","最新順","入手順"].forEach((t,m)=>{const b=document.createElement("button");b.className="tab"+(m===zmode?" on":"");b.textContent=t;b.onclick=()=>{zmode=m;renderZ()};$("ztabs").appendChild(b)});
$("zt").textContent="みゅアルバム　"+store.own.length+"枚";
 $("zg").innerHTML="";
 if(!store.own.length){$("zg").innerHTML='<div style="grid-column:1/-1;text-align:center;color:#b9a8e0;font-size:min(3.8vw,3.8vh)">まだ1枚もないみゅ…</div>';return}
 zlist().forEach((i,k)=>{const c=CARDS[i],d=document.createElement("div");d.className="zc got";{const im=document.createElement("img");im.loading="lazy";im.decoding="async";im.alt="";im.src=c[0];d.appendChild(im)}
  d.insertAdjacentHTML("beforeend",((store.cnt&&store.cnt[i]||1)>=2?'<span class="n">'+store.cnt[i]+'</span>':"")+(store.fav.includes(i)?'<span class="h">♥</span>':""));
  d.onclick=()=>{cur=i;$("vimg").src=c[0];$("vcap").textContent=c[3];paintFav();$("view").classList.add("on")};
  $("zg").appendChild(d)})}
mkActs($("racts"));mkActs($("vacts"));paintFav();renderZ();

// ===== ログインボーナス（毎日0時を過ぎて最初に開いたとき +3G） =====
{const d=new Date(),today=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();let bonus=false;
 if(typeof store.g!=="number"){store.g=3;store.d=today}
 else if(store.d!==today){store.g+=3;store.d=today;bonus=true}
 g=store.g;save();showG();
 if(bonus)setTimeout(()=>toast("ログインボーナス　+3G みゅ！"),3200)}
$("zbtn").onclick=()=>{if(!busy){renderZ();$("zukan").classList.add("on")}};
$("zc").onclick=()=>$("zukan").classList.remove("on");$("vc").onclick=()=>$("view").classList.remove("on");
</script></body></html>
